version: 2
updates:
  # Only devDependencies exist here (electron, electron-builder, playwright), so
  # these bumps affect the build and the tests rather than anything shipped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"

  # Workflow actions are pinned to commit SHAs, which means they never pick up a
  # retagged release on their own. Dependabot is what keeps them moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
