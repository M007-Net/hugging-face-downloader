name: Tests
on: [push, pull_request, workflow_dispatch]

# Read-only by default. No job here needs to write to the repository, and a
# workflow that cannot write cannot be turned into one that does by a dependency.
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  terminal:
    name: Terminal (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      # Actions are pinned to commit SHAs rather than tags: a tag can be moved
      # to point at different code. Dependabot keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The interpreter is chosen inside `run`, not with `shell:`. A `shell:` value is
      # validated before the matrix is expanded, so `shell: ${{ matrix.shell }}` left an
      # unresolved expression where a known shell name had to be: the whole workflow
      # failed to start, produced no jobs at all, and showed up in Actions under its
      # file path instead of its name. The point of the matrix - running the suite under
      # both Windows PowerShell 5.1 and PowerShell 7 - is unchanged.
      - name: Run offline tests
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1

  desktop:
    name: Desktop (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # package.json declares "node": ">=20", so the floor is tested as well as a
      # current LTS. Testing only the newest would let the declared floor rot - which
      # is exactly how `npm test` came to be broken on 20 without anyone noticing.
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # ELECTRON_SKIP_BINARY_DOWNLOAD keeps CI off the ~100MB Electron binary:
      # these suites exercise core.cjs and the static UI, neither of which
      # launches a window.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Core unit tests
        run: npm test
      - name: UI smoke test
        run: npm run qa
      # The lockfile is what `npm ci` installs from, so a pull request that edits
      # package.json without regenerating it would install something other than
      # what it claims.
      - name: Lockfile is in sync
        run: |
          git diff --exit-code -- package-lock.json
